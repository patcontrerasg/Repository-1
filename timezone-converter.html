<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Conversor de Horarios</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --card2: #16213e;
      --accent: #e94560;
      --accent2: #0f3460;
      --text: #eaeaea;
      --muted: #888;
      --border: #2a2a4a;
      --radius: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
    }

    header { text-align: center; margin-bottom: 28px; }
    header h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.5px; }
    header h1 span { color: var(--accent); }
    header p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      max-width: 440px;
    }

    .city-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }

    label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
    }

    select, input[type="time"] {
      width: 100%;
      padding: 13px 14px;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      appearance: none;
      -webkit-appearance: none;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input[type="time"]:focus { border-color: var(--accent); }
    select option, select optgroup { background: #1a1a2e; color: var(--text); }

    .select-wrapper { position: relative; }
    .select-wrapper::after {
      content: '▾';
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--muted);
      font-size: 1rem;
    }

    .swap-btn { display: flex; justify-content: center; margin: 4px 0 16px; }
    .swap-btn button {
      background: var(--accent2);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 42px; height: 42px;
      color: var(--text);
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    .swap-btn button:active { transform: scale(0.9); background: var(--accent); }

    .time-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
    }
    .time-row .arrow { color: var(--accent); font-size: 1.3rem; text-align: center; margin-top: 22px; }

    .convert-btn {
      width: 100%;
      padding: 15px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .convert-btn:active { opacity: 0.85; transform: scale(0.98); }

    .result-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      max-width: 440px;
      margin-top: 16px;
      display: none;
    }
    .result-card.visible { display: block; }

    .result-header {
      font-size: 0.75rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.8px;
      color: var(--muted); margin-bottom: 12px;
    }

    .result-main { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

    .city-time { flex: 1; text-align: center; }
    .city-time .city-name { font-size: 0.9rem; color: var(--muted); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .city-time .time-display { font-size: 2rem; font-weight: 700; letter-spacing: -1px; color: var(--text); }
    .city-time .date-display { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

    .result-arrow { font-size: 1.5rem; color: var(--accent); flex-shrink: 0; }

    .diff-badge {
      text-align: center; margin-top: 16px;
      padding: 8px 14px; background: var(--card2);
      border-radius: 8px; font-size: 0.85rem; color: var(--muted);
    }
    .diff-badge span { color: var(--accent); font-weight: 700; }

    .now-btn {
      width: 100%; max-width: 440px;
      padding: 10px; background: transparent;
      border: 1px solid var(--border); border-radius: 10px;
      color: var(--muted); font-size: 0.85rem; cursor: pointer;
      margin-top: 10px; transition: border-color 0.2s, color 0.2s;
    }
    .now-btn:active { border-color: var(--accent); color: var(--accent); }

    .world-clock { width: 100%; max-width: 440px; margin-top: 24px; }
    .world-clock h2 {
      font-size: 0.75rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.8px;
      color: var(--muted); margin-bottom: 10px;
    }

    .clock-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .clock-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
    .clock-item .clock-city { font-size: 0.78rem; color: var(--muted); }
    .clock-item .clock-time { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; margin: 2px 0; }
    .clock-item .clock-date { font-size: 0.7rem; color: var(--muted); }
  </style>
</head>
<body>

          <option value="Australia/Melbourne">Melbourne</option>
          <option value="Australia/Brisbane">Brisbane</option>

    </div>
  </div>

  <div class="swap-btn">
    <button id="swapBtn" title="Intercambiar ciudades">⇅</button>
  </div>

  <div class="city-row">
    <label>Ciudad destino</label>
    <div class="select-wrapper">
      <select id="cityTo">
        <optgroup label="América Latina">
          <option value="America/Argentina/Buenos_Aires">Buenos Aires</option>
          <option value="America/Bogota">Bogotá</option>
          <option value="America/Mexico_City">Ciudad de México</option>
          <option value="America/Lima">Lima</option>
          <option value="America/Santiago">Santiago</option>
          <option value="America/Caracas">Caracas</option>
          <option value="America/La_Paz">La Paz</option>
          <option value="America/Asuncion">Asunción</option>
          <option value="America/Montevideo">Montevideo</option>
          <option value="America/Guayaquil">Quito</option>
          <option value="America/Panama">Panamá</option>
          <option value="America/Costa_Rica">San José (CR)</option>
          <option value="America/Guatemala">Guatemala</option>
          <option value="America/Havana">La Habana</option>
          <option value="America/Santo_Domingo">Santo Domingo</option>
          <option value="America/Puerto_Rico">San Juan (PR)</option>
        </optgroup>
        <optgroup label="Norteamérica">
          <option value="America/New_York">Nueva York / Miami</option>
          <option value="America/Chicago">Chicago</option>
          <option value="America/Denver">Denver</option>
          <option value="America/Los_Angeles">Los Ángeles</option>
          <option value="America/Toronto">Toronto</option>
          <option value="America/Vancouver">Vancouver</option>
          <option value="America/Anchorage">Anchorage</option>
          <option value="Pacific/Honolulu">Honolulu</option>
        </optgroup>
        <optgroup label="Europa">
          <option value="Europe/London">Londres</option>
          <option value="Europe/Madrid" selected>Madrid</option>
          <option value="Europe/Paris">París</option>
          <option value="Europe/Berlin">Berlín</option>
          <option value="Europe/Rome">Roma</option>
          <option value="Europe/Amsterdam">Ámsterdam</option>
          <option value="Europe/Lisbon">Lisboa</option>
          <option value="Europe/Moscow">Moscú</option>
          <option value="Europe/Istanbul">Estambul</option>
          <option value="Europe/Warsaw">Varsovia</option>
          <option value="Europe/Athens">Atenas</option>
          <option value="Europe/Stockholm">Estocolmo</option>
          <option value="Europe/Zurich">Zúrich</option>
          <option value="Atlantic/Reykjavik">Reikiavik</option>
        </optgroup>
        <optgroup label="Medio Oriente y Asia Central">
          <option value="Asia/Dubai">Dubái</option>
          <option value="Asia/Riyadh">Riad</option>
          <option value="Asia/Jerusalem">Tel Aviv</option>
          <option value="Asia/Tehran">Teherán</option>
          <option value="Asia/Karachi">Karachi</option>
          <option value="Asia/Kolkata">Mumbai / Delhi</option>
          <option value="Asia/Dhaka">Dhaka</option>
          <option value="Asia/Tashkent">Tashkent</option>

  <div class="time-row">

    </div>
    <div class="arrow">→</div>
    <div class="city-row" style="margin:0; opacity:0.4" id="outputWrapper">
      <label>Resultado</label>

    </div>
  </div>

<button class="now-btn" id="nowBtn">Usar hora actual</button>

<div class="result-card" id="resultCard">
  <div class="result-header">Resultado</div>
  <div class="result-main">
    <div class="city-time">
      <div class="city-name" id="resFromCity">—</div>
      <div class="time-display" id="resFromTime">—</div>
      <div class="date-display" id="resFromDate">—</div>
    </div>
    <div class="result-arrow">→</div>
    <div class="city-time">
      <div class="city-name" id="resToCity">—</div>
      <div class="time-display" id="resToTime">—</div>
      <div class="date-display" id="resToDate">—</div>
    </div>
  </div>
  <div class="diff-badge" id="diffBadge"></div>
</div>

<div class="world-clock">
  <h2>Hora actual en el mundo</h2>
  <div class="clock-grid" id="clockGrid"></div>
</div>

<script>
  const WORLD_CLOCKS = [
    { name: "Nueva York",     tz: "America/New_York" },
    { name: "Londres",        tz: "Europe/London" },
    { name: "Madrid",         tz: "Europe/Madrid" },
    { name: "Dubái",          tz: "Asia/Dubai" },
    { name: "Tokio",          tz: "Asia/Tokyo" },
    { name: "Sídney",         tz: "Australia/Sydney" },
    { name: "Ciudad de México", tz: "America/Mexico_City" },
    { name: "Buenos Aires",   tz: "America/Argentina/Buenos_Aires" },
  ];

  const cityFrom   = document.getElementById('cityFrom');
  const cityTo     = document.getElementById('cityTo');
  const timeInput  = document.getElementById('timeInput');
  const timeOutput = document.getElementById('timeOutput');
  const outputWrapper = document.getElementById('outputWrapper');
  const convertBtn = document.getElementById('convertBtn');
  const swapBtn    = document.getElementById('swapBtn');
  const nowBtn     = document.getElementById('nowBtn');
  const resultCard = document.getElementById('resultCard');
  const clockGrid  = document.getElementById('clockGrid');

  function setNow() {
    const now = new Date();
    timeInput.value = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  }
  setNow();

  function getOffsetMinutes(tz) {
    const now = new Date();
    const local = new Date(now.toLocaleString('en-US', { timeZone: tz }));
    return (local - now) / 60000;
  }

  function formatTime(date, tz) {
    return new Intl.DateTimeFormat('es', {
      hour: '2-digit', minute: '2-digit', hour12: false, timeZone: tz
    }).format(date);
  }

  function formatDate(date, tz) {
    return new Intl.DateTimeFormat('es', {
      weekday: 'long', day: 'numeric', month: 'short', timeZone: tz
    }).format(date);
  }

  function getSelectedName(sel) {
    return sel.options[sel.selectedIndex].text;
  }

  function convert() {
    const fromTz   = cityFrom.value;
    const toTz     = cityTo.value;
    const fromName = getSelectedName(cityFrom);
    const toName   = getSelectedName(cityTo);

    const parts = timeInput.value.split(':');
    const hh = parseInt(parts[0], 10) || 0;
    const mm = parseInt(parts[1], 10) || 0;

    const fromOffset = getOffsetMinutes(fromTz);
    const toOffset   = getOffsetMinutes(toTz);
    const now = new Date();

    const baseDate = new Date(Date.UTC(
      now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(),
      hh, mm, 0
    ) - fromOffset * 60000);

    const fromTime = formatTime(baseDate, fromTz);
    const toTime   = formatTime(baseDate, toTz);
    const fromDate = formatDate(baseDate, fromTz);
    const toDate   = formatDate(baseDate, toTz);

    timeOutput.value = toTime;
    outputWrapper.style.opacity = '1';

    document.getElementById('resFromCity').textContent = fromName;
    document.getElementById('resFromTime').textContent = fromTime;
    document.getElementById('resFromDate').textContent = fromDate;
    document.getElementById('resToCity').textContent   = toName;
    document.getElementById('resToTime').textContent   = toTime;
    document.getElementById('resToDate').textContent   = toDate;

    const diffMin = Math.round(toOffset - fromOffset);
    const sign    = diffMin >= 0 ? '+' : '-';
    const absMin  = Math.abs(diffMin);
    const diffH   = Math.floor(absMin / 60);
    const diffM   = absMin % 60;
    const diffStr = diffM === 0 ? `${sign}${diffH}h` : `${sign}${diffH}h ${diffM}min`;

    document.getElementById('diffBadge').innerHTML =
      `${toName} tiene <span>${diffStr}</span> respecto a ${fromName}`;

    resultCard.classList.add('visible');
  }

  convertBtn.addEventListener('click', convert);
  nowBtn.addEventListener('click', () => { setNow(); convert(); });
  swapBtn.addEventListener('click', () => {
    const tmp = cityFrom.value;
    cityFrom.value = cityTo.value;
    cityTo.value = tmp;
    if (resultCard.classList.contains('visible')) convert();
  });
  timeInput.addEventListener('change', () => { if (resultCard.classList.contains('visible')) convert(); });
  cityFrom.addEventListener('change', () => { if (resultCard.classList.contains('visible')) convert(); });
  cityTo.addEventListener('change',   () => { if (resultCard.classList.contains('visible')) convert(); });

  function buildWorldClocks() {
    WORLD_CLOCKS.forEach(c => {
      const el = document.createElement('div');
      el.className = 'clock-item';
      el.dataset.tz = c.tz;
      el.innerHTML = `<div class="clock-city">${c.name}</div><div class="clock-time">--:--</div><div class="clock-date">—</div>`;
      clockGrid.appendChild(el);
    });
  }

  function tickClocks() {
    const now = new Date();
    document.querySelectorAll('.clock-item').forEach(el => {
      el.querySelector('.clock-time').textContent = formatTime(now, el.dataset.tz);
      el.querySelector('.clock-date').textContent = formatDate(now, el.dataset.tz);
    });
  }

  buildWorldClocks();
  tickClocks();
  setInterval(tickClocks, 1000);
  convert();
</script>
</body>
</html>
