<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Conversor de Horarios</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --card2: #16213e;
      --accent: #e94560;
      --accent2: #0f3460;
      --text: #eaeaea;
      --muted: #888;
      --border: #2a2a4a;
      --radius: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
    }

    header { text-align: center; margin-bottom: 28px; }
    header h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.5px; }
    header h1 span { color: var(--accent); }
    header p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      max-width: 440px;
    }

    .city-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }

    label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
    }

    select, input[type="time"] {
      width: 100%;
      padding: 13px 14px;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      appearance: none;
      -webkit-appearance: none;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input[type="time"]:focus { border-color: var(--accent); }
    select option, select optgroup { background: #1a1a2e; color: var(--text); }

    .select-wrapper { position: relative; }
    .select-wrapper::after {
      content: '▾';
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--muted);
      font-size: 1rem;
    }

    .swap-btn { display: flex; justify-content: center; margin: 4px 0 16px; }
    .swap-btn button {
      background: var(--accent2);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 42px; height: 42px;
      color: var(--text);
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    .swap-btn button:active { transform: scale(0.9); background: var(--accent); }

    .time-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
    }
    .time-row .arrow { color: var(--accent); font-size: 1.3rem; text-align: center; margin-top: 22px; }

    .convert-btn {
      width: 100%;
      padding: 15px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .convert-btn:active { opacity: 0.85; transform: scale(0.98); }

    .result-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      max-width: 440px;
      margin-top: 16px;
      display: none;
    }
    .result-card.visible { display: block; }

    .result-header {
      font-size: 0.75rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.8px;
      color: var(--muted); margin-bottom: 12px;
    }

    .result-main { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

    .city-time { flex: 1; text-align: center; }
    .city-time .city-name { font-size: 0.9rem; color: var(--muted); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .city-time .time-display { font-size: 2rem; font-weight: 700; letter-spacing: -1px; color: var(--text); }
    .city-time .date-display { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

    .result-arrow { font-size: 1.5rem; color: var(--accent); flex-shrink: 0; }

    .diff-badge {
      text-align: center; margin-top: 16px;
      padding: 8px 14px; background: var(--card2);
      border-radius: 8px; font-size: 0.85rem; color: var(--muted);
    }
    .diff-badge span { color: var(--accent); font-weight: 700; }

    .now-btn {
      width: 100%; max-width: 440px;
      padding: 10px; background: transparent;
      border: 1px solid var(--border); border-radius: 10px;
      color: var(--muted); font-size: 0.85rem; cursor: pointer;
      margin-top: 10px; transition: border-color 0.2s, color 0.2s;
    }
    .now-btn:active { border-color: var(--accent); color: var(--accent); }

    .world-clock { width: 100%; max-width: 440px; margin-top: 24px; }
    .world-clock h2 {
      font-size: 0.75rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.8px;
      color: var(--muted); margin-bottom: 10px;
    }

    .clock-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .clock-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
    .clock-item .clock-city { font-size: 0.78rem; color: var(--muted); }
    .clock-item .clock-time { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; margin: 2px 0; }
    .clock-item .clock-date { font-size: 0.7rem; color: var(--muted); }
  </style>
</head>
<body>

<script>
  // UTC offsets in minutes (positive = east of UTC).
  // Values reflect DST state as of April 2026.
  // If Intl timezone API is available it will be used instead for DST accuracy.
  var OFFSETS = {
    "America/Argentina/Buenos_Aires": -180,
    "America/Bogota": -300,
    "America/Mexico_City": -300,
    "America/Lima": -300,
    "America/Santiago": -180,
    "America/Caracas": -240,
    "America/La_Paz": -240,
    "America/Asuncion": -240,
    "America/Montevideo": -180,
    "America/Guayaquil": -300,
    "America/Panama": -300,
    "America/Costa_Rica": -360,
    "America/Guatemala": -360,
    "America/Havana": -240,
    "America/Santo_Domingo": -240,
    "America/Puerto_Rico": -240,
    "America/New_York": -240,
    "America/Chicago": -300,
    "America/Denver": -360,
    "America/Los_Angeles": -420,
    "America/Toronto": -240,
    "America/Vancouver": -420,
    "America/Anchorage": -480,
    "Pacific/Honolulu": -600,
    "Europe/London": 60,
    "Europe/Madrid": 120,
    "Europe/Paris": 120,
    "Europe/Berlin": 120,
    "Europe/Rome": 120,
    "Europe/Amsterdam": 120,
    "Europe/Brussels": 120,
    "Europe/Lisbon": 60,
    "Europe/Moscow": 180,
    "Europe/Istanbul": 180,
    "Europe/Warsaw": 120,
    "Europe/Athens": 180,
    "Europe/Bucharest": 180,
    "Europe/Stockholm": 120,
    "Europe/Oslo": 120,
    "Europe/Helsinki": 180,
    "Europe/Zurich": 120,
    "Atlantic/Reykjavik": 0,
    "Asia/Dubai": 240,
    "Asia/Riyadh": 180,
    "Asia/Jerusalem": 180,
    "Asia/Tehran": 270,
    "Asia/Karachi": 300,
    "Asia/Kolkata": 330,
    "Asia/Dhaka": 360,
    "Asia/Tashkent": 300,
    "Asia/Almaty": 300,
    "Asia/Bangkok": 420,
    "Asia/Singapore": 480,
    "Asia/Kuala_Lumpur": 480,
    "Asia/Hong_Kong": 480,
    "Asia/Shanghai": 480,
    "Asia/Tokyo": 540,
    "Asia/Seoul": 540,
    "Asia/Jakarta": 420,
    "Asia/Manila": 480,
    "Asia/Ho_Chi_Minh": 420,
    "Asia/Colombo": 330,
    "Asia/Kabul": 270,
    "Africa/Cairo": 180,
    "Africa/Lagos": 60,
    "Africa/Nairobi": 180,
    "Africa/Johannesburg": 120,
    "Africa/Casablanca": 60,
    "Africa/Accra": 0,
    "Africa/Addis_Ababa": 180,
    "Australia/Sydney": 600,
    "Australia/Melbourne": 600,
    "Australia/Brisbane": 600,
    "Australia/Perth": 480,
    "Pacific/Auckland": 720
  };

  var WORLD_CLOCKS = [
    { name: "Nueva York",   tz: "America/New_York" },
    { name: "Londres",      tz: "Europe/London" },
    { name: "Madrid",       tz: "Europe/Madrid" },
    { name: "Dubai",        tz: "Asia/Dubai" },
    { name: "Tokio",        tz: "Asia/Tokyo" },
    { name: "Sidney",       tz: "Australia/Sydney" },
    { name: "Mexico",       tz: "America/Mexico_City" },
    { name: "Bs. Aires",    tz: "America/Argentina/Buenos_Aires" }
  ];

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function getOffset(tz) {
    try {
      var now  = new Date();
      var fmt  = new Intl.DateTimeFormat("en-US", {
        timeZone: tz,
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", second: "2-digit",
        hour12: false
      });
      var p    = {};
      var pArr = fmt.formatToParts(now);
      for (var i = 0; i < pArr.length; i++) { p[pArr[i].type] = pArr[i].value; }
      var h    = parseInt(p.hour, 10);
      if (h === 24) h = 0;
      var tzMs = Date.UTC(parseInt(p.year,10), parseInt(p.month,10)-1,
                          parseInt(p.day,10), h, parseInt(p.minute,10),
                          parseInt(p.second,10));
      return Math.round((tzMs - now.getTime()) / 60000);
    } catch (e) {
      return typeof OFFSETS[tz] !== "undefined" ? OFFSETS[tz] : 0;
    }
  }

  function convert() {
    var fromSel  = document.getElementById("cityFrom");
    var toSel    = document.getElementById("cityTo");
    var tInput   = document.getElementById("timeInput");
    var tOutput  = document.getElementById("timeOutput");
    var resCard  = document.getElementById("resultCard");
    var outWrap  = document.getElementById("outputWrapper");

    var fromTz   = fromSel.value;
    var toTz     = toSel.value;
    var fromName = fromSel.options[fromSel.selectedIndex].text;
    var toName   = toSel.options[toSel.selectedIndex].text;

    var val = tInput.value || "00:00";
    var sep = val.indexOf(":");
    var hh  = sep >= 0 ? parseInt(val.substring(0, sep),   10) : 0;
    var mm  = sep >= 0 ? parseInt(val.substring(sep + 1),  10) : 0;
    if (isNaN(hh)) hh = 0;
    if (isNaN(mm)) mm = 0;

    var fromOff   = getOffset(fromTz);
    var toOff     = getOffset(toTz);
    var inputMins = hh * 60 + mm;
    var totalMins = inputMins - fromOff + toOff;
    var normMins  = ((totalMins % 1440) + 1440) % 1440;
    var toH = Math.floor(normMins / 60);
    var toM = normMins % 60;

    var dayOff = 0;
    if (totalMins >= 1440)  dayOff =  1;
    else if (totalMins < 0) dayOff = -1;

    var DAYS   = ["Dom","Lun","Mar","Mie","Jue","Vie","Sab"];
    var MONTHS = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
    var today  = new Date();

    function dateLabel(dOff) {
      var d = new Date(today.getTime() + dOff * 86400000);
      return DAYS[d.getDay()] + ", " + d.getDate() + " " + MONTHS[d.getMonth()];
    }

    tOutput.value = pad(toH) + ":" + pad(toM);
    outWrap.style.opacity = "1";

    document.getElementById("resFromCity").textContent = fromName;
    document.getElementById("resFromTime").textContent = pad(hh) + ":" + pad(mm);
    document.getElementById("resFromDate").textContent = dateLabel(0);
    document.getElementById("resToCity").textContent   = toName;
    document.getElementById("resToTime").textContent   = pad(toH) + ":" + pad(toM);
    document.getElementById("resToDate").textContent   =
      dayOff === 0 ? dateLabel(0) : dateLabel(dayOff) + (dayOff > 0 ? " (+1 dia)" : " (-1 dia)");

    var diff  = toOff - fromOff;
    var sign  = diff >= 0 ? "+" : "-";
    var abs   = Math.abs(diff);
    var dh    = Math.floor(abs / 60);
    var dm    = abs % 60;
    var dStr  = dm === 0 ? sign + dh + "h" : sign + dh + "h " + dm + "min";
    document.getElementById("diffBadge").innerHTML =
      toName + " tiene <span>" + dStr + "</span> respecto a " + fromName;

    resCard.style.display = "block";
  }

  function doSwap() {
    var f = document.getElementById("cityFrom");
    var t = document.getElementById("cityTo");
    var tmp = f.value; f.value = t.value; t.value = tmp;
    convert();
  }

  function doNow() {
    var d = new Date();
    document.getElementById("timeInput").value = pad(d.getHours()) + ":" + pad(d.getMinutes());
    convert();
  }

  document.getElementById("convertBtn").onclick = convert;
  document.getElementById("swapBtn").onclick     = doSwap;
  document.getElementById("nowBtn").onclick      = doNow;
  document.getElementById("cityFrom").onchange   = convert;
  document.getElementById("cityTo").onchange     = convert;
  document.getElementById("timeInput").onchange  = convert;

  // World clock - pure UTC arithmetic, no Intl timezone needed
  var grid = document.getElementById("clockGrid");
  for (var ci = 0; ci < WORLD_CLOCKS.length; ci++) {
    var wc  = WORLD_CLOCKS[ci];
    var cel = document.createElement("div");
    cel.className = "clock-item";
    cel.setAttribute("data-tz", wc.tz);
    cel.innerHTML = "<div class='clock-city'>" + wc.name + "</div>" +
                    "<div class='clock-time'>--:--</div>" +
                    "<div class='clock-date'>...</div>";
    grid.appendChild(cel);
  }

  function tickClocks() {
    var now     = new Date();
    var utcMins = now.getUTCHours() * 60 + now.getUTCMinutes();
    var DAYS    = ["Dom","Lun","Mar","Mie","Jue","Vie","Sab"];
    var items   = document.querySelectorAll(".clock-item");
    for (var i = 0; i < items.length; i++) {
      var el   = items[i];
      var tz   = el.getAttribute("data-tz");
      var off  = typeof OFFSETS[tz] !== "undefined" ? OFFSETS[tz] : 0;
      var mins = ((utcMins + off) % 1440 + 1440) % 1440;
      el.querySelector(".clock-time").textContent = pad(Math.floor(mins/60)) + ":" + pad(mins%60);
      var dOff = utcMins + off >= 1440 ? 1 : utcMins + off < 0 ? -1 : 0;
      var dd   = new Date(now.getTime() + dOff * 86400000);
      el.querySelector(".clock-date").textContent = DAYS[dd.getDay()] + " " + dd.getDate();
    }
  }

  tickClocks();
  setInterval(tickClocks, 1000);
  doNow();
</script>
</body>
</html>
