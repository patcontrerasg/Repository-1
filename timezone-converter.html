<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Conversor de Horarios</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --card2: #16213e;
      --accent: #e94560;
      --accent2: #0f3460;
      --text: #eaeaea;
      --muted: #888;
      --border: #2a2a4a;
      --radius: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
    }

    header { text-align: center; margin-bottom: 28px; }
    header h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.5px; }
    header h1 span { color: var(--accent); }
    header p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      max-width: 440px;
    }

    .city-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }

    label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
    }

    select, input[type="time"] {
      width: 100%;
      padding: 13px 14px;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      appearance: none;
      -webkit-appearance: none;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input[type="time"]:focus { border-color: var(--accent); }
    select option, select optgroup { background: #1a1a2e; color: var(--text); }

    .select-wrapper { position: relative; }
    .select-wrapper::after {
      content: '▾';
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--muted);
      font-size: 1rem;
    }

    .swap-btn { display: flex; justify-content: center; margin: 4px 0 16px; }
    .swap-btn button {
      background: var(--accent2);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 42px; height: 42px;
      color: var(--text);
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    .swap-btn button:active { transform: scale(0.9); background: var(--accent); }

    .time-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
    }
    .time-row .arrow { color: var(--accent); font-size: 1.3rem; text-align: center; margin-top: 22px; }

    .convert-btn {
      width: 100%;
      padding: 15px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .convert-btn:active { opacity: 0.85; transform: scale(0.98); }

    .result-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      max-width: 440px;
      margin-top: 16px;
      display: none;
    }
    .result-card.visible { display: block; }

    .result-header {
      font-size: 0.75rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.8px;
      color: var(--muted); margin-bottom: 12px;
    }

    .result-main { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

    .city-time { flex: 1; text-align: center; }
    .city-time .city-name { font-size: 0.9rem; color: var(--muted); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .city-time .time-display { font-size: 2rem; font-weight: 700; letter-spacing: -1px; color: var(--text); }
    .city-time .date-display { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

    .result-arrow { font-size: 1.5rem; color: var(--accent); flex-shrink: 0; }

    .diff-badge {
      text-align: center; margin-top: 16px;
      padding: 8px 14px; background: var(--card2);
      border-radius: 8px; font-size: 0.85rem; color: var(--muted);
    }
    .diff-badge span { color: var(--accent); font-weight: 700; }

    .now-btn {
      width: 100%; max-width: 440px;
      padding: 10px; background: transparent;
      border: 1px solid var(--border); border-radius: 10px;
      color: var(--muted); font-size: 0.85rem; cursor: pointer;
      margin-top: 10px; transition: border-color 0.2s, color 0.2s;
    }
    .now-btn:active { border-color: var(--accent); color: var(--accent); }

    .world-clock { width: 100%; max-width: 440px; margin-top: 24px; }
    .world-clock h2 {
      font-size: 0.75rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.8px;
      color: var(--muted); margin-bottom: 10px;
    }

    .clock-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .clock-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
    .clock-item .clock-city { font-size: 0.78rem; color: var(--muted); }
    .clock-item .clock-time { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; margin: 2px 0; }
    .clock-item .clock-date { font-size: 0.7rem; color: var(--muted); }
  </style>
</head>
<body>

    <div class="select-wrapper">

          <option value="America/Bogota">Bogotá</option>

          <option value="America/Caracas">Caracas</option>
          <option value="America/La_Paz">La Paz</option>
          <option value="America/Asuncion">Asunción</option>
          <option value="America/Montevideo">Montevideo</option>

          <option value="Europe/Warsaw">Varsovia</option>
          <option value="Europe/Athens">Atenas</option>
          <option value="Europe/Stockholm">Estocolmo</option>
          <option value="Europe/Zurich">Zúrich</option>
          <option value="Atlantic/Reykjavik">Reikiavik</option>
        </optgroup>
        <optgroup label="Medio Oriente y Asia Central">

  <div class="time-row">

    <div class="city-row" style="margin:0; opacity:0.4" id="outputWrapper">
      <label>Resultado</label>

    </div>

<button class="now-btn" id="nowBtn">Usar hora actual</button>

<div class="result-card" id="resultCard">
  <div class="result-header">Resultado</div>
  <div class="result-main">
    <div class="city-time">
      <div class="city-name" id="resFromCity">—</div>
      <div class="time-display" id="resFromTime">—</div>
      <div class="date-display" id="resFromDate">—</div>
    </div>
    <div class="result-arrow">→</div>
    <div class="city-time">
      <div class="city-name" id="resToCity">—</div>
      <div class="time-display" id="resToTime">—</div>
      <div class="date-display" id="resToDate">—</div>
    </div>
  </div>
  <div class="diff-badge" id="diffBadge"></div>
</div>

<div class="world-clock">
  <h2>Hora actual en el mundo</h2>
  <div class="clock-grid" id="clockGrid"></div>
</div>

<script>
  var WORLD_CLOCKS = [
    { name: "Nueva York",       tz: "America/New_York" },
    { name: "Londres",          tz: "Europe/London" },
    { name: "Madrid",           tz: "Europe/Madrid" },
    { name: "Dubai",            tz: "Asia/Dubai" },
    { name: "Tokio",            tz: "Asia/Tokyo" },
    { name: "Sidney",           tz: "Australia/Sydney" },
    { name: "Mexico",           tz: "America/Mexico_City" },
    { name: "Buenos Aires",     tz: "America/Argentina/Buenos_Aires" }
  ];

  var cityFrom    = document.getElementById('cityFrom');
  var cityTo      = document.getElementById('cityTo');
  var timeInput   = document.getElementById('timeInput');
  var timeOutput  = document.getElementById('timeOutput');
  var outputWrapper = document.getElementById('outputWrapper');
  var convertBtn  = document.getElementById('convertBtn');
  var swapBtn     = document.getElementById('swapBtn');
  var nowBtn      = document.getElementById('nowBtn');
  var resultCard  = document.getElementById('resultCard');
  var clockGrid   = document.getElementById('clockGrid');

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function setNow() {
    var now = new Date();
    timeInput.value = pad(now.getHours()) + ':' + pad(now.getMinutes());
  }
  setNow();

  // Get UTC offset in ms for a timezone at a given Date
  function getOffsetMs(tz, date) {
    try {
      var fmt = new Intl.DateTimeFormat('en-US', {
        timeZone: tz,
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hour12: false
      });
      var p = {};
      fmt.formatToParts(date).forEach(function(part) { p[part.type] = part.value; });
      var h = parseInt(p.hour, 10);
      if (h === 24) h = 0;
      var tzMs = Date.UTC(
        parseInt(p.year, 10),
        parseInt(p.month, 10) - 1,
        parseInt(p.day, 10),
        h,
        parseInt(p.minute, 10),
        parseInt(p.second, 10)
      );
      return tzMs - date.getTime();
    } catch(e) {
      return 0;
    }
  }

  function formatTime(date, tz) {
    try {
      var s = new Intl.DateTimeFormat('es', {
        hour: '2-digit', minute: '2-digit', hour12: false, timeZone: tz
      }).format(date);
      return s;
    } catch(e) {
      return '--:--';
    }
  }

  function formatDate(date, tz) {
    try {
      return new Intl.DateTimeFormat('es', {
        weekday: 'long', day: 'numeric', month: 'short', timeZone: tz
      }).format(date);
    } catch(e) {
      return '';
    }
  }

  function convert() {
    try {
      var fromTz   = cityFrom.value;
      var toTz     = cityTo.value;
      var fromName = cityFrom.options[cityFrom.selectedIndex].text;
      var toName   = cityTo.options[cityTo.selectedIndex].text;

      var timeVal = timeInput.value || '00:00';
      var parts   = timeVal.split(':');
      var hh = parseInt(parts[0], 10) || 0;
      var mm = parseInt(parts[1], 10) || 0;

      var now = new Date();

      // Get today's date components in the "from" timezone
      var dayFmt = new Intl.DateTimeFormat('en-US', {
        timeZone: fromTz,
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour12: false
      });
      var dp = {};
      dayFmt.formatToParts(now).forEach(function(part) { dp[part.type] = part.value; });

      // Naive UTC timestamp treating local time as UTC
      var naive = new Date(Date.UTC(
        parseInt(dp.year, 10),
        parseInt(dp.month, 10) - 1,
        parseInt(dp.day, 10),
        hh, mm, 0
      ));

      // Correct for the fromTz offset
      var offsetMs = getOffsetMs(fromTz, naive);
      var utcDate  = new Date(naive.getTime() - offsetMs);

      var fromTime = formatTime(utcDate, fromTz);
      var toTime   = formatTime(utcDate, toTz);
      var fromDate = formatDate(utcDate, fromTz);
      var toDate   = formatDate(utcDate, toTz);

      // Diff for display
      var fromOff = getOffsetMs(fromTz, utcDate);
      var toOff   = getOffsetMs(toTz, utcDate);
      var diffMin = Math.round((toOff - fromOff) / 60000);
      var sign    = diffMin >= 0 ? '+' : '-';
      var absMin  = Math.abs(diffMin);
      var diffH   = Math.floor(absMin / 60);
      var diffM   = absMin % 60;
      var diffStr = diffM === 0
        ? sign + diffH + 'h'
        : sign + diffH + 'h ' + diffM + 'min';

      timeOutput.value = toTime;
      outputWrapper.style.opacity = '1';

      document.getElementById('resFromCity').textContent = fromName;
      document.getElementById('resFromTime').textContent = fromTime;
      document.getElementById('resFromDate').textContent = fromDate;
      document.getElementById('resToCity').textContent   = toName;
      document.getElementById('resToTime').textContent   = toTime;
      document.getElementById('resToDate').textContent   = toDate;
      document.getElementById('diffBadge').innerHTML     =
        toName + ' tiene <span>' + diffStr + '</span> respecto a ' + fromName;

      resultCard.classList.add('visible');
    } catch(e) {
      alert('Error al convertir: ' + e.message);
    }
  }

  convertBtn.addEventListener('click', convert);

  nowBtn.addEventListener('click', function() { setNow(); convert(); });

  swapBtn.addEventListener('click', function() {
    var tmp = cityFrom.value;
    cityFrom.value = cityTo.value;
    cityTo.value = tmp;
    convert();
  });

  timeInput.addEventListener('change', function() {
    if (resultCard.classList.contains('visible')) convert();
  });
  cityFrom.addEventListener('change', function() {
    if (resultCard.classList.contains('visible')) convert();
  });
  cityTo.addEventListener('change', function() {
    if (resultCard.classList.contains('visible')) convert();
  });

  function buildWorldClocks() {
    WORLD_CLOCKS.forEach(function(c) {
      var el = document.createElement('div');
      el.className = 'clock-item';
      el.setAttribute('data-tz', c.tz);
      el.innerHTML =
        '<div class="clock-city">' + c.name + '</div>' +
        '<div class="clock-time">--:--</div>' +
        '<div class="clock-date">-</div>';
      clockGrid.appendChild(el);
    });
  }

  function tickClocks() {
    var now = new Date();
    var items = document.querySelectorAll('.clock-item');
    for (var i = 0; i < items.length; i++) {
      var el = items[i];
      var tz = el.getAttribute('data-tz');
      el.querySelector('.clock-time').textContent = formatTime(now, tz);
      el.querySelector('.clock-date').textContent = formatDate(now, tz);
    }
  }

  buildWorldClocks();
  tickClocks();
  setInterval(tickClocks, 1000);
  convert();
</script>
</body>
</html>
